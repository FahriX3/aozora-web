server {
    listen 80;
    server_name aozora.synchrolabs.site 161.118.235.23 localhost;

    root /var/www/aozora/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Storage link for uploads
    location ^~ /storage/ {
        alias /var/www/aozora/storage/app/public/;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires max;
    }

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|mp3)$ {
        try_files $uri =404;
        access_log off;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI PHP processing
    location ~ \.php$ {
        fastcgi_pass aozora-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Deny hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
